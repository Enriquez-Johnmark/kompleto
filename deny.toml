# cargo-deny: licences, security advisories, duplicate versions and sources.

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.9
# Our own crates are unpublished and skipped: Kompleto, and its engine
# Nudgewright (AGPL-3.0-only; the owner holds its copyright, ADR 0006).
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/Enriquez-Johnmark/loopwright"]
