{% extends "base.html" %}
{% block title %}Log in · Kompleto{% endblock %}
{% block body %}
<h1>Log in to Kompleto</h1>
<form method="post" action="/login">
  <label for="email">Your email</label>
  <input type="email" id="email" name="email" required autocomplete="email">
  <p><button>Email me a login link</button></p>
</form>
{% endblock %}
