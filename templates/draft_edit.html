{% extends "base.html" %}
{% block title %}Edit draft · Kompleto{% endblock %}
{% block body %}
{% include "nav.html" %}
<h1>Edit the draft to {{ draft.client }}</h1>
{% if let Some(error) = error %}<p class="error">{{ error }}</p>{% endif %}
<p>To {{ draft.to }}. Saving needs a fresh approval.</p>
<form method="post" action="/drafts/{{ draft.id }}">
  <label for="subject">Subject</label>
  <input type="text" id="subject" name="subject" value="{{ draft.subject }}" required maxlength="200">
  <label for="body">Message</label>
  <textarea id="body" name="body" rows="14" cols="70" required>{{ draft.body }}</textarea>
  <p><button>Save</button> <a href="/drafts">Cancel</a></p>
</form>
{% endblock %}
