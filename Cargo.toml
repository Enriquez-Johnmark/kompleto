[package]
name = "kompleto"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Document and BIR-deadline chaser for Philippine bookkeepers, on a reusable agent engine"

[features]
# Test-only crash points for the E1 test; never enabled in production builds.
failpoints = []

[dependencies]
anyhow = "1.0.104"
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
axum = { version = "0.8.9", features = ["multipart"] }
calamine = "0.37.0"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
csv = "1.4.0"
dotenvy = "0.15.7"
encoding_rs = "0.8.42"
getrandom = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.13.5", features = ["json"] }
rustix = { version = "1.1.5", features = ["process"] }
secrecy = "0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros", "migrate", "uuid", "time", "json"] }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "macros", "parsing", "formatting"] }
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "signal", "time", "process", "io-util", "fs"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v7", "serde"] }

[dev-dependencies]
insta = "1.49.0"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[[test]]
name = "e1_crash"
required-features = ["failpoints"]

[lints.rust]
unsafe_code = "forbid"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
redundant_clone = "deny"
needless_collect = "deny"
