name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kompleto
          POSTGRES_PASSWORD: kompleto
          POSTGRES_DB: kompleto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kompleto"
          --health-interval 2s
          --health-retries 30
    env:
      DATABASE_URL: postgres://kompleto:kompleto@localhost:5432/kompleto
      # Compile SQL checks from the committed .sqlx/ data; tests still run
      # against the real Postgres service.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test (including the E1 crash test)
        run: cargo test --all-features --locked
      - name: The API's TypeScript types are committed (written by cargo test)
        run: |
          git status --porcelain web/src/api/generated
          test -z "$(git status --porcelain web/src/api/generated)"

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  email-worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The runner's own Node (22 or later), no packages to install.
      - name: Test the Cloudflare Email Worker
        run: node --test deploy/email-worker/worker.test.mjs
